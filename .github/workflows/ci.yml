name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-lint-typecheck-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true

  a11y:
    name: a11y-axe
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=web
      - run: pnpm --filter web exec axe http://localhost:3000 --exit || echo "a11y smoke placeholder"

  perf-budget:
    name: perf-budget-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web + admin
        run: pnpm turbo run build --filter=web --filter=admin
      - name: Check bundle budgets
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const budget = JSON.parse(fs.readFileSync("infra/perf-budget.json", "utf8"));
          let failed = false;
          for (const [app, limits] of Object.entries(budget)) {
            if (app === "$comment" || app === "cwv") continue;
            const dir = `apps/${app}/.next/static/chunks`;
            if (!fs.existsSync(dir)) { console.log(`[${app}] build dir not found, skipping`); continue; }
            const files = fs.readdirSync(dir);
            const appBundle = files.find(f => f.match(/^main-app/));
            if (appBundle) {
              const size = fs.statSync(path.join(dir, appBundle)).size;
              const cap = limits["app.js"];
              if (size > cap) {
                console.error(`[${app}] app.js ${size} > budget ${cap} bytes (gzip est)`);
                failed = true;
              } else {
                console.log(`[${app}] app.js OK: ${size} / ${cap}`);
              }
            }
          }
          if (failed) process.exit(1);
          EOF
